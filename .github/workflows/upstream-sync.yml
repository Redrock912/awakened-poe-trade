name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Fork Master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and Fetch Upstream
        run: |
          git remote add upstream https://github.com/SnosMe/awakened-poe-trade.git
          git fetch upstream master

      - name: Check for Upstream Changes
        id: check_changes
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/master)
          BASE=$(git merge-base HEAD upstream/master)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "::notice::No new changes in upstream."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ "$LOCAL" = "$BASE" ]; then
            echo "::notice::Upstream has new changes to merge."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Diverged branches found, attempt merge."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge Upstream Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          if ! git merge upstream/master --no-edit -m "sync: merge upstream changes from SnosMe/awakened-poe-trade"; then
            echo "Conflict detected during merge. Preserving Korean client compatibility files..."
            
            git checkout --ours -- renderer/public/data/ko/ || true
            git checkout --ours -- renderer/src/web/client-log/client-log.ts || true
            git checkout --ours -- renderer/src/web/item-search/WidgetItemSearch.vue || true
            git checkout --ours -- main/src/vision/wasm-bindings.ts || true
            git checkout --ours -- main/package.json || true

            git add .
            git commit -m "sync: resolve conflicts by prioritizing Korean client compatibility"
          fi

      - name: Regenerate Data Index Files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          cd renderer
          npm ci
          npm run make-index-files
          if [ -n "$(git status --porcelain)" ]; then
            git add public/data/
            git commit -m "build: regenerate binary data index files after upstream sync"
          fi

      - name: Push Merged Changes to Fork
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git push origin master
